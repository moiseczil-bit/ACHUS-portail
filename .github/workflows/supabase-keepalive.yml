name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 * * 1"
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier la disponibilité de Supabase
        env:
          # Valeurs publiques identiques au portail ; aucune clé privilégiée.
          SUPABASE_URL: https://hyktpddailftuwmbakdm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_9B8gTwnHPR5PtJokvusYVQ_3wSw0Mjr
        run: |
          set -euo pipefail
          # ping() ne renvoie que l'heure du serveur. Une base déjà en pause
          # doit être réactivée par son propriétaire depuis Supabase.
          code=$(curl -sS --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 5 \
            -o /tmp/achus-ping.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/rpc/ping")
          echo "HTTP ${code}"
          case "${code}" in
            2*) echo "Supabase répond." ;;
            *) echo "::error::Supabase ne répond pas normalement. Vérifiez l'état du projet ACHUS dans Supabase."; exit 1 ;;
          esac
