name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 * * 1"
    - cron: "0 12 * * 4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Ajoutez les secrets SUPABASE_URL et SUPABASE_ANON_KEY."
            exit 1
          fi
          code=$(curl -sS -o /tmp/ping.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/rpc/ping")
          echo "HTTP ${code}"
          cat /tmp/ping.json
          echo
          case "${code}" in
            2*) exit 0 ;;
            *) echo "Le ping a échoué. La migration est-elle appliquée ?"; exit 1 ;;
          esac
