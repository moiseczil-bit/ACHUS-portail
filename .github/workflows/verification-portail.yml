name: Vérification du portail
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vérifier la migration et les droits RLS
        run: bash scripts/test-migration.sh
        env:
          ACHUS_TEST_EMBARQUE: '1'
      - name: Vérifier les parcours du portail
        run: npm run test:interface
      - name: Vérifier la récupération de compte
        run: npm run test:recuperation
