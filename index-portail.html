<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F2350">
<title>ACHUS — Portail des membres</title>
<link rel="stylesheet" href="css/portail.css">
<link rel="icon" href="assets/ecusson.png">
</head>
<body>
<div id="toast" class="toast" hidden role="status"></div>

<section id="ecran-auth" class="ecran-auth">
  <div class="auth-col">
    <div class="marque">
      <img src="assets/ecusson.png" alt="Écusson ACHUS">
      <div>
        <h1>ACHUS</h1>
        <p>Corps d'Honneur Universel de Santo</p>
      </div>
    </div>
    <p class="slogan">« Lajenès se lavni peyi an »</p>
    <div class="panneau">
      <div class="onglets">
        <button type="button" id="tab-login" class="actif">Connexion</button>
        <button type="button" id="tab-adhesion">Adhésion</button>
      </div>
      <form id="form-login">
        <div id="login-msg" class="msg" hidden></div>
        <label class="champ"><span>Adresse e-mail</span><input id="login-email" type="email" autocomplete="username" required placeholder="exemple@email.com"></label>
        <label class="champ"><span>Mot de passe</span><input id="login-password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label>
        <button class="btn btn-navy" type="submit">Se connecter</button>
      </form>
      <form id="form-adhesion" hidden>
        <div id="reg-msg" class="msg" hidden></div>
        <label class="champ"><span>Prénom</span><input id="reg-prenom" autocomplete="given-name" required placeholder="Marie"></label>
        <label class="champ"><span>Nom</span><input id="reg-nom" autocomplete="family-name" required placeholder="Joseph"></label>
        <label class="champ"><span>Téléphone</span><input id="reg-tel" type="tel" autocomplete="tel" required placeholder="+509 …"></label>
        <label class="champ"><span>Adresse e-mail</span><input id="reg-email" type="email" autocomplete="email" required placeholder="exemple@email.com"></label>
        <label class="champ"><span>Mot de passe</span><input id="reg-password" type="password" autocomplete="new-password" required minlength="6" placeholder="6 caractères minimum"></label>
        <label class="champ"><span>Quartier</span><input id="reg-quartier" required placeholder="Santo 13"></label>
        <label class="champ"><span>Programme d'intérêt</span><input id="reg-programme" placeholder="Leadership, musique, discipline…"></label>
        <label class="champ"><span>Motivation</span><textarea id="reg-motivation" placeholder="Pourquoi souhaitez-vous rejoindre l'ACHUS ?"></textarea></label>
        <label class="check"><input id="reg-parent" type="checkbox"> Je suis un parent ou un tuteur (cela ne donne aucun droit de gestion)</label>
        <button class="btn btn-navy" type="submit">Envoyer ma demande</button>
      </form>
    </div>
    <div class="contacts">
      <h2>Contacter l'ACHUS</h2>
      <a href="https://wa.me/50939180332">WhatsApp · +509 39 18 0332</a>
      <a href="mailto:achushaiti@gmail.com">achushaiti@gmail.com</a>
      <p class="meta">Santo 13, Croix-des-Bouquets, Haïti</p>
    </div>
  </div>
</section>

<section id="ecran-app" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-marque">
      <img src="assets/ecusson.png" alt="">
      <div><strong>ACHUS</strong><small>Portail des membres</small></div>
    </div>
    <div class="qui">
      <div id="qui-nom" class="nom">…</div>
      <div id="qui-role" class="role">…</div>
    </div>
    <nav id="nav"></nav>
    <button type="button" id="btn-logout" class="btn btn-logout">Se déconnecter</button>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h2 id="titre-page">Accueil</h2>
        <p id="sous-titre"></p>
      </div>
    </header>
    <div id="contenu" aria-busy="false"></div>
  </div>
</section>

<div id="modal" class="modal" hidden></div>
<noscript><p style="padding:16px">Activez JavaScript pour utiliser le portail ACHUS.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
